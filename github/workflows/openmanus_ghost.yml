name: OpenManus Ghost Session
on: 
  workflow_dispatch: # يسمح لك بتشغيله يدوياً في أي وقت

jobs:
  run-openmanus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # إعداد ملف الإعدادات تلقائياً بمفتاحك
          mkdir -p config
          echo '[llm]' > config/config.toml
          echo 'model = "gpt-4o"' >> config/config.toml
          echo 'base_url = "https://api.openai.com/v1"' >> config/config.toml
          echo 'api_key = "sk-vfgdqodobnvydsnucpyartgpwlnjrtsavkojfkhsvuahshnq"' >> config/config.toml
          echo 'max_tokens = 4096' >> config/config.toml
          echo 'temperature = 0.0' >> config/config.toml

      - name: Setup Tmate Session (The Secret Tunnel)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true # للأمان: أنت فقط من يستطيع الدخول
          
